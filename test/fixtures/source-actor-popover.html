<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feed-source hover card fixture</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f3f2ef;
      }

      body {
        width: 554px;
        margin-inline: auto;
        padding-block-start: 24px;
      }

      /* __CARD_CSS__ */
    </style>
  </head>
  <body>
    <aside class="pangram-gallery-card" data-fixture-kind="artwork" aria-label="AI post replaced">
      <div class="pangram-gallery-card__image-stage">
        <div class="pangram-gallery-card__image-frame">
          <a class="pangram-gallery-card__image-link" href="#artwork">
            <img
              class="pangram-gallery-card__image"
              alt="Charles I at the Hunt by Anthony van Dyck"
              src="__APPROVED_ARTWORK_DATA_URI__"
            />
          </a>
          <blockquote class="pangram-gallery-card__poem" hidden></blockquote>
        </div>
      </div>
      <div class="pangram-gallery-card__body">
        <p class="pangram-gallery-card__notice" hidden></p>
        <a class="pangram-gallery-card__title" href="#artwork">Charles I at the Hunt</a>
        <p class="pangram-gallery-card__location">Anthony van Dyck · 1635</p>
        <button class="pangram-gallery-card__toggle" type="button">Show original</button>
        <div class="pangram-gallery-card__source-actor">
          <span class="pangram-gallery-card__source-actor-prefix">Shown because </span><button
            class="pangram-gallery-card__source-actor-trigger"
            type="button"
            aria-expanded="true"
            aria-controls="pangram-gallery-source-popover"
          >Charles L Mauro CHFP</button><span class="pangram-gallery-card__source-actor-action"> likes this</span>
        </div>
        <span class="pangram-gallery-card__source">Original post by <a class="pangram-gallery-card__author" href="#post">Matthew Holloway</a></span>
        <span class="pangram-gallery-card__verdict pangram-gallery-card__verdict--ai" aria-label="Pangram verdict: AI">🤖 AI</span>
      </div>
    </aside>

    <section
      id="pangram-gallery-source-popover"
      class="pangram-gallery-source-popover"
      role="dialog"
      aria-label="Feed source"
      style="inline-size: 300px; inset-inline-start: 116px; inset-block-start: 625px"
    >
      <a class="pangram-gallery-source-popover__profile" href="#profile">Charles L Mauro CHFP</a>
      <p class="pangram-gallery-source-popover__context">This post appeared because Charles L Mauro CHFP likes this.</p>
      <p class="pangram-gallery-source-popover__status" role="status">LinkedIn confirmed Unfollow Charles L Mauro CHFP.</p>
      <button class="pangram-gallery-source-popover__unfollow" type="button">Unfollow</button>
    </section>
  </body>
</html>
