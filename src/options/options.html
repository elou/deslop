<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>De-Slop</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="mark" aria-hidden="true"><span></span></div>
        <div>
          <h1>💩 De-Slop</h1>
          <p>Small pauses for AI-heavy feeds.</p>
        </div>
      </header>

      <section class="section section-status" aria-labelledby="extension-heading">
        <div>
          <h2 id="extension-heading">Replace flagged posts</h2>
          <p>Runs anywhere Pangram adds a verdict.</p>
        </div>
        <label class="switch">
          <span class="sr-only">Enable De-Slop</span>
          <input id="enabled" type="checkbox" />
          <span class="switch-track" aria-hidden="true"><span></span></span>
        </label>
      </section>

      <section class="section" aria-labelledby="verdict-heading">
        <div class="section-heading">
          <p class="kicker">Replace</p>
          <h2 id="verdict-heading">Pangram verdicts</h2>
        </div>
        <div class="choice-block">
          <label class="choice choice-fixed">
            <input type="checkbox" checked disabled />
            <span>
              <strong>AI</strong>
              <small>Always replaced when the extension is on</small>
            </span>
          </label>
          <label class="stream-picker stream-picker-verdict" for="stream-ai">
            <span>Show</span>
            <select id="stream-ai"></select>
          </label>
        </div>
        <div class="choice-block">
          <label class="choice">
            <input id="replace-mixed" type="checkbox" />
            <span>
              <strong>Mixed</strong>
              <small>Also replace posts Pangram considers partly AI</small>
            </span>
          </label>
          <label class="stream-picker stream-picker-verdict" for="stream-mixed">
            <span>Show</span>
            <select id="stream-mixed"></select>
          </label>
        </div>
        <div class="choice-block">
          <label class="choice">
            <input id="replace-assisted" type="checkbox" />
            <span>
              <strong>AI-Assisted</strong>
              <small>Also replace posts Pangram marks as AI-assisted</small>
            </span>
          </label>
          <label class="stream-picker stream-picker-verdict" for="stream-assisted">
            <span>Show</span>
            <select id="stream-assisted"></select>
          </label>
        </div>
        <button id="style-mode-toggle" class="style-mode-toggle" type="button">
          Style each differently
        </button>
        <label class="stream-picker stream-picker-shared" for="stream-shared">
          <span>Show for every replacement</span>
          <select id="stream-shared"></select>
        </label>
      </section>

      <footer class="footer">
        <span id="save-status" role="status" aria-live="polite">Saved automatically</span>
        <a href="https://github.com/elou/deslop#content-streams" target="_blank" rel="noreferrer">About streams</a>
      </footer>
    </main>

    <script src="../content-core.js"></script>
    <script src="options.js"></script>
  </body>
</html>
