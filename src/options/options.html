<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>De-Slop</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>De-Slop</h1>
        <button id="close-options" class="close-options" type="button" aria-label="Close options">×</button>
      </header>

      <section class="section" aria-labelledby="verdict-heading">
        <div class="section-heading">
          <h2 id="verdict-heading">Pangram Filters</h2>
          <button id="style-mode-toggle" class="style-mode-toggle" type="button">
            Style each differently
          </button>
        </div>
        <div class="choice-block verdict-choice" data-active="true">
          <label class="choice choice-fixed">
            <input type="checkbox" checked disabled />
            <strong>AI</strong>
          </label>
          <label class="stream-picker stream-picker-verdict" for="stream-ai">
            <span>Replace with…</span>
            <select id="stream-ai"></select>
          </label>
        </div>
        <div class="choice-block verdict-choice">
          <label class="choice">
            <input id="replace-mixed" type="checkbox" />
            <strong>Mixed</strong>
          </label>
          <label class="stream-picker stream-picker-verdict" for="stream-mixed">
            <span>Replace with…</span>
            <select id="stream-mixed"></select>
          </label>
        </div>
        <div class="choice-block verdict-choice">
          <label class="choice">
            <input id="replace-assisted" type="checkbox" />
            <strong>AI-Assisted</strong>
          </label>
          <label class="stream-picker stream-picker-verdict" for="stream-assisted">
            <span>Replace with…</span>
            <select id="stream-assisted"></select>
          </label>
        </div>
        <label class="stream-picker stream-picker-shared" for="stream-shared">
          <span>Replace with…</span>
          <select id="stream-shared"></select>
        </label>
      </section>

      <section class="section" aria-labelledby="cleanup-heading">
        <div class="section-heading">
          <h2 id="cleanup-heading">Feed cleanup</h2>
        </div>
        <div class="choice-block cleanup-choice">
          <label class="choice">
            <input id="hide-promoted" type="checkbox" />
            <strong>Hide promoted posts</strong>
          </label>
          <label class="stream-picker" for="stream-promoted">
            <span>Replace with…</span>
            <select id="stream-promoted"></select>
          </label>
        </div>
        <div class="choice-block cleanup-choice">
          <label class="choice">
            <input id="hide-suggested" type="checkbox" />
            <strong>Hide suggested posts</strong>
          </label>
          <label class="stream-picker" for="stream-suggested">
            <span>Replace with…</span>
            <select id="stream-suggested"></select>
          </label>
        </div>
      </section>

      <details class="configure-section">
        <summary class="configure-summary">
          <h2>Configure</h2>
          <svg
            class="configure-chevron"
            viewBox="0 0 20 20"
            width="20"
            height="20"
            aria-hidden="true"
          >
            <path d="m5.5 7.5 4.5 4.5 4.5-4.5" />
          </svg>
        </summary>
        <div class="configure-options">
          <label class="choice platform-choice">
            <input id="platform-linkedin" type="checkbox" checked />
            <strong>LinkedIn</strong>
          </label>
          <label class="choice platform-choice">
            <input id="platform-x" type="checkbox" />
            <strong>X.com</strong>
          </label>
          <section class="vocabulary-section" aria-labelledby="vocabulary-heading" hidden>
            <div class="section-heading">
              <h2 id="vocabulary-heading">Vocabulary feed</h2>
            </div>
            <label class="choice">
              <input id="vocabulary-enabled" type="checkbox" />
              <strong>Use saved vocabulary</strong>
            </label>
            <p id="vocabulary-status" role="status">Loading saved vocabulary…</p>
          </section>
        </div>
      </details>

      <footer class="panel-footer">
        <a class="history-link" href="../report/report.html" target="_blank">
          View hidden feed report
          <span aria-hidden="true">↗</span>
        </a>
      </footer>

    </main>

    <script src="../content-core.js"></script>
    <script type="module" src="options.js"></script>
  </body>
</html>
